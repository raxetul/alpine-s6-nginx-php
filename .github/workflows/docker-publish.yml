name: ci

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  multi:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Alpine version
        id: alpine
        run: |
          base=$(awk 'toupper($1) == "FROM" { print $2; exit }' Dockerfile)
          full=$(docker run --rm --entrypoint cat "$base" /etc/alpine-release | tr -d '[:space:]')
          case "$full" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::unexpected alpine release string: '$full'" >&2; exit 1 ;;
          esac
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "minor=${full%.*}" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/s390x
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ github.repository }}:latest
            ${{ github.repository }}:${{ steps.alpine.outputs.minor }}
            ${{ github.repository }}:${{ steps.alpine.outputs.full }}
            ${{ github.repository }}:${{ steps.date.outputs.date }}
